<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B192C">
<title>بايونيرز كار – إدارة الأسطول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0B192C',sea:'#1E3E62',gold:'#D4A22E',blue:'#1C75BC'},fontFamily:{sans:['Cairo','sans-serif']}}}}</script>
<style>
body{font-family:'Cairo',sans-serif;background:#F1F5F9;color:#0B192C;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.inp{width:100%;border:1px solid #CBD5E1;border-radius:.75rem;padding:.6rem .8rem;background:#fff;outline:none}
.inp:focus{border-color:#D4A22E;box-shadow:0 0 0 3px #D4A22E33}
.btn{border-radius:.75rem;padding:.6rem 1rem;font-weight:700;transition:.15s}
.btn:active{transform:scale(.97)}
.bg-grad{background:linear-gradient(135deg,#0B192C,#1E3E62)}
.card{background:#fff;border-radius:1rem;box-shadow:0 1px 6px #0b192c14;padding:1rem}
.lbl{font-size:.8rem;font-weight:600;color:#475569;display:block;margin-bottom:.2rem}
table{border-collapse:collapse;width:100%}th,td{padding:.4rem .5rem;text-align:right;white-space:nowrap}
.tabbtn{padding:.5rem 1rem;border-radius:9999px;font-weight:700;white-space:nowrap;background:#fff;color:#1E3E62}
.tabbtn.on{background:#D4A22E;color:#0B192C}
#pr{display:none}
@media print{body{background:#fff;padding:0}#app,#toast,#modal{display:none!important}#pr{display:block}@page{size:A4;margin:0}}
#pr{font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:296.5mm;position:relative;overflow:hidden;page-break-after:always;background-size:100% 100%;background-repeat:no-repeat;color:#000}
.pg:last-child{page-break-after:auto}
.pg .f{position:absolute;right:11mm;left:11mm;top:30mm;font-weight:700;font-size:13px;line-height:9mm}
.pg .t{position:absolute;right:11mm;left:11mm;top:71mm}
.pg table{border:2px solid #000;table-layout:fixed}
.pg th{background:#FFE699;height:15mm;border:2px solid #000;text-align:center;font-weight:800;font-size:12px;white-space:normal}
.pg td{height:10.2mm;border:2px solid #000;text-align:center;padding:0 2px;white-space:normal;font-size:11px;font-weight:600;overflow:hidden;line-height:1.15}
.pg td.nt{font-size:8.5px}
</style></head>

 <div class="card space-y-2"><div class="font-bold">💵 تسجيل سداد للمحطة</div><div class="grid grid-cols-2 gap-2"><input id="pa" type="number" step="any" class="inp" placeholder="المبلغ المسدد"><input id="pd" type="date" class="inp" value="${td()}"></div><input id="pn" class="inp" placeholder="ملاحظة (رقم سند / طريقة السداد)"><button class="btn bg-green-600 text-white w-full" onclick="payS('${id}')">سداد وخصم من المديونية</button></div>
 <div class="card overflow-x-auto"><div class="font-bold mb-2">كشف الحساب</div>${L.length?`<table class="text-sm"><thead><tr class="bg-yellow-100"><th>التاريخ</th><th>البيان</th><th>التفاصيل</th><th>مدين (فاتورة)</th><th>دائن (سداد)</th><th>الرصيد</th><th></th></tr></thead><tbody>${L.map(x=>`<tr class="border-b"><td>${x.d}</td><td>${x.t}</td><td>${esc(x.det)}</td><td>${x.de?n(x.de,2):''}</td><td class="text-green-700">${x.cr?n(x.cr,2):''}</td><td class="font-bold">${n(x.run,2)}</td><td>${x.rid?`<button onclick="viewImg('${x.rid}')">🧾</button>`:`<button onclick="delPay('${x.pid}')">✖</button>`}</td></tr>`).join('')}</tbody></table>`:'<div class="text-slate-500 text-sm">لا توجد حركات بعد</div>'}</div>`}

function csvDl(name,rows){const t='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function csvV(id,k){const v=vById(id),s=stats(v),F=k=='fuel';csvDl((F?'وقود_':'صيانة_')+v.plate+'.csv',F?[['الرقم','التاريخ','الوقود باللتر','سعر الوقود','العداد عند التعبئة','الإجمالي','السائق','المحطة','طريقة السداد'],...s.fuel.map((x,i)=>[i+1,x.date,x.liters,x.price,x.odo,x.total,x.driver,x.station,x.pay])]:[['الرقم','التاريخ','وصف الصيانة','العداد عند الصيانة','عداد الغيّار القادم','التكلفة','اسم السائق'],...s.mt.map((x,i)=>[i+1,x.date,x.desc,x.odo,x.next||'',x.cost,x.driver])])}
function csvFleet(){csvDl('ملخص_الأسطول.csv',[['المركبة','اللوحة','العداد الحالي','المسافة','إجمالي الوقود','إجمالي الصيانة','CPK','كم/لتر'],
 ...db.vehicles.map(v=>{const s=stats(v);return [v.name,v.plate,s.cur,s.dist,s.F.toFixed(2),s.M.toFixed(2),s.cpk?s.cpk.toFixed(2):'',s.kpl?s.kpl.toFixed(2):'']})])}

 const v=vById(id),s=stats(v),F=kind=='fuel',rows=F?s.fuel:s.mt;

 const cols=F?[['الرقم',7],['التاريخ',12],['اسم السائق',17],['الوقود باللتر',13],['سعر الوقود',12],['العداد عند التعبئة',16],['ملاحظات',23]]:[['الرقم',7],['التاريخ',13],['وصف الصيانة',27],['العداد عند الصيانة',15],['عداد الغيّار القادم',14],['التكلفة',11],['اسم السائق',13]];
 const cells=(x,i)=>F?[i,x.date,x.driver,n(x.liters,2),n(x.price,2),n(x.odo),x.station+' • '+(x.pay=='عهدة'?'عهدة':'آجل')]:[i,x.date,x.desc,n(x.odo),x.next?n(x.next):'',n(x.cost,2),x.driver];
 const tot=rows.reduce((a,x)=>a+(F?x.total:x.cost),0),pages=Math.max(1,Math.ceil(rows.length/16));let h='';
 for(let p=0;p<pages;p++){let b='';
  for(let i=0;i<16;i++){const k=p*16+i,x=rows[k],c=x?cells(x,k+1):[k+1,...Array(cols.length-1).fill('')];
   b+='<tr>'+c.map((t,j)=>`<td class="${F&&j==6?'nt ':''}">${esc(t)}</td>`).join('')+'</tr>'}
  h+=`<div class="pg" style="background-image:url(${BG})"><div class="f"><div>اسم السائق: ${esc(drv)||'..........................'}</div>
  <div style="display:flex;justify-content:space-between"><span>نوع السيارة: ${esc(v.name)}</span><span>${F?'إجمالي الوقود':'إجمالي الصيانة'}: ${n(tot,2)}</span></div>
  <div style="display:flex;justify-content:space-between"><span>رقم اللوحة: ${esc(v.plate)}</span><u style="font-size:15px">${F?'جدول تعبئة الوقود':'جدول الصيانة'}</u><span style="width:30mm;text-align:left">${p+1}/${pages}</span></div></div>
  <div class="t"><table><colgroup>${cols.map(c=>`<col style="width:${c[1]}%">`).join('')}</colgroup><thead><tr>${cols.map(c=>`<th${['الوقود باللتر','ملاحظات'].includes(c[0])?'':''}>${c[0]}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table></div></div>`}
